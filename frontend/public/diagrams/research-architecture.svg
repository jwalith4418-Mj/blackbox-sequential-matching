<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520" role="img" aria-labelledby="title description"><title id="title">Blackbox offline research and release architecture</title><desc id="description">Seeded synthetic splits feed training and frozen paired evaluation against baselines. Evaluation writes source-identified records and checks promotion gates. The observed decision retains conservative; recorded artifacts separately feed Evidence and the original 242-success and 238-zero-score casebook. This is offline research, not the live simulator.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:18px;font-weight:700;fill:#30372e}.sub{font-size:13px;fill:#78816c}.edge{font-size:11px;font-weight:600;fill:#879475}.label{font-size:10px;letter-spacing:1.5px;font-weight:700;fill:#9b8c73}.wire{fill:none;stroke:#8e9c7c;stroke-width:2;stroke-linejoin:round}.return{fill:none;stroke:#dc9672;stroke-width:2;stroke-dasharray:5 5;stroke-linejoin:round}.number{font-size:11px;font-weight:700;fill:#9ca88d}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#8e9c7c"/></marker><marker id="reply" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#dc9672"/></marker></defs><rect width="1160" height="520" rx="16" fill="#fcfcf8"/><rect x="20" y="86" width="855" height="402" rx="16" fill="#f1f4e9" stroke="#cdd6bf" stroke-dasharray="6 5"/><text x="40" y="113" class="label" text-anchor="start">OFFLINE PYTHON RESEARCH · SEPARATE FROM LIVE SESSIONS</text><path d="M250 210H325" class="wire" marker-end="url(#arrow)"/><text x="287" y="195" class="edge" text-anchor="middle">Train split</text><path d="M545 210H625" class="wire" marker-end="url(#arrow)"/><text x="585" y="195" class="edge" text-anchor="middle">Candidate</text><path d="M40 195H8V55H735V150" class="wire" marker-end="url(#arrow)"/><text x="445" y="43" class="edge" text-anchor="middle">Frozen evaluation worlds + matched baseline comparison</text><path d="M845 210H920" class="wire" marker-end="url(#arrow)"/><text x="883" y="195" class="edge" text-anchor="middle">Records</text><path d="M735 280V345" class="wire" marker-end="url(#arrow)"/><text x="735" y="317" class="edge" text-anchor="middle">Release checks</text><path d="M625 405H545" class="wire" marker-end="url(#arrow)"/><text x="585" y="390" class="edge" text-anchor="middle">Held</text><path d="M1025 280V345" class="wire" marker-end="url(#arrow)"/><text x="1025" y="317" class="edge" text-anchor="middle">Read only</text><g><rect x="40" y="150" width="210" height="130" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="60" y="175">01</text><text class="title" x="60" y="203">Synthetic kit</text><text class="sub" x="60" y="228">Seeded data splits</text><text class="sub" x="60" y="249">6 scenario families</text></g><g><rect x="325" y="150" width="220" height="130" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="345" y="175">02</text><text class="title" x="345" y="203">Candidate fitting</text><text class="sub" x="345" y="228">Training data only</text><text class="sub" x="345" y="249">Versioned model artifacts</text></g><g><rect x="625" y="150" width="220" height="130" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="645" y="175">03</text><text class="title" x="645" y="203">Paired evaluation</text><text class="sub" x="645" y="228">Baselines + ablations</text><text class="sub" x="645" y="249">Timely / eventual targets</text></g><g><rect x="920" y="150" width="215" height="130" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="940" y="175">04</text><text class="title" x="940" y="203">Study records</text><text class="sub" x="940" y="228">Source / plan digests</text><text class="sub" x="940" y="249">Episode action hashes</text></g><g><rect x="325" y="345" width="220" height="120" rx="12" fill="#fff4e9" stroke="#dce2d2"/><text class="number" x="345" y="370">05</text><text class="title" x="345" y="398">Conservative stays</text><text class="sub" x="345" y="423">Observed release choice</text><text class="sub" x="345" y="444">No candidate promotion</text></g><g><rect x="625" y="345" width="220" height="120" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="645" y="370">06</text><text class="title" x="645" y="398">Promotion gate</text><text class="sub" x="645" y="423">Uncertainty &amp; family checks</text><text class="sub" x="645" y="444">Exact-mode container check</text></g><g><rect x="920" y="345" width="215" height="120" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="940" y="370">07</text><text class="title" x="940" y="398">Evidence + cases</text><text class="sub" x="940" y="423">Original: 242 success</text><text class="sub" x="940" y="444">238 zero-score runs</text></g><text x="580" y="510" class="sub" text-anchor="middle">Offline records support inspection; they never overwrite live-pool results or silently promote a model.</text></svg>