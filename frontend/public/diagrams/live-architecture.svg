<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="title description"><title id="title">Blackbox live system architecture</title><desc id="description">Browser requests pass through Visitor cookie to a Vercel session API. The API reads and saves owner-scoped libSQL state, executes the conservative policy and private synthetic world, and returns only observed snapshots. Future simulator data never reaches the browser.</desc><style>text{font-family:Arial,Helvetica,sans-serif} .title{font-size:18px;font-weight:700;fill:#30372e}.sub{font-size:13px;fill:#78816c}.edge{font-size:11px;font-weight:600;fill:#879475}.label{font-size:10px;letter-spacing:1.5px;font-weight:700;fill:#9b8c73}.wire{fill:none;stroke:#8e9c7c;stroke-width:2;stroke-linejoin:round}.return{fill:none;stroke:#dc9672;stroke-width:2;stroke-dasharray:5 5;stroke-linejoin:round}.number{font-size:11px;font-weight:700;fill:#9ca88d}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 9 5 1 9Z" fill="#8e9c7c"/></marker><marker id="reply" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9Z" fill="#dc9672"/></marker></defs><rect width="1100" height="490" rx="16" fill="#fcfcf8"/><rect x="500" y="35" width="575" height="420" rx="16" fill="#f1f4e9" stroke="#cdd6bf" stroke-dasharray="6 5"/><text x="525" y="63" class="label" text-anchor="start">SERVER-SIDE · VERCEL FUNCTIONS + LIBSQL</text><path d="M240 230H295" class="wire" marker-end="url(#arrow)"/><text x="268" y="217" class="edge" text-anchor="middle">Request</text><path d="M465 230H525" class="wire" marker-end="url(#arrow)"/><text x="495" y="217" class="edge" text-anchor="middle">Identity</text><path d="M525 282H465" class="return" marker-end="url(#reply)"/><path d="M295 282H240" class="return" marker-end="url(#reply)"/><path d="M735 235H770V145H815" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="773" y="123" class="edge" text-anchor="middle">Load / save</text><path d="M735 278H770V370H815" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="770" y="399" class="edge" text-anchor="middle">Step / observe</text><g><rect x="30" y="185" width="210" height="140" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="50" y="210">01</text><text class="title" x="50" y="238">Browser workspace</text><text class="sub" x="50" y="263">Live pool · Results</text><text class="sub" x="50" y="284">Activity · CSV exports</text></g><g><rect x="295" y="193" width="170" height="125" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="315" y="218">02</text><text class="title" x="315" y="246">Visitor cookie</text><text class="sub" x="315" y="271">HttpOnly · Secure</text><text class="sub" x="315" y="292">Server-issued identity</text></g><g><rect x="525" y="185" width="210" height="140" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="545" y="210">03</text><text class="title" x="545" y="238">Session API</text><text class="sub" x="545" y="263">Validate input &amp; owner</text><text class="sub" x="545" y="284">Revision / retry checks</text></g><g><rect x="815" y="90" width="235" height="115" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="835" y="115">04</text><text class="title" x="835" y="143">libSQL storage</text><text class="sub" x="835" y="168">Private state JSON</text><text class="sub" x="835" y="189">Owner · revision · request ID</text></g><g><rect x="815" y="305" width="235" height="135" rx="12" fill="#ffffff" stroke="#dce2d2"/><text class="number" x="835" y="330">05</text><text class="title" x="835" y="358">Policy + simulator</text><text class="sub" x="835" y="383">Conservative JS policy</text><text class="sub" x="835" y="404">Private seeded future events</text><text class="sub" x="835" y="425">Observe current-day feedback</text></g><text x="278" y="354" class="edge" text-anchor="middle">Observed snapshot only</text><text x="278" y="376" class="sub" text-anchor="middle">No latent biases or future replies</text><text x="550" y="477" class="sub" text-anchor="middle">Solid arrows: requests &amp; server state     ·     Dashed arrows: observed response to the browser</text></svg>